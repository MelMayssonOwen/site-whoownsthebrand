name: Pull TimeToPost articles
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttp-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch new posts
        env:
          TTP_PUBLIC_TOKEN: ${{ secrets.TTP_PUBLIC_TOKEN }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          TEMPLATE: ${{ vars.TTP_TEMPLATE }}
        run: node .github/ttp-pull/pull.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ttp-pull"
            git config user.email "ttp-pull@users.noreply.github.com"
            git add -A
            git commit -m "Add new articles from TimeToPost"
            git push
          else
            echo "Nothing new."
          fi
